name: Validate skill list

on:
  push:
    branches: [main]
    paths: ['list.json', 'schema.json', 'scripts/**', 'LIST.md', '.github/workflows/validate-list.yml']
  pull_request:
    paths: ['list.json', 'schema.json', 'scripts/**', 'LIST.md']
  schedule:
    - cron: '0 7 * * 1' # weekly drift check: sources can disappear or rewrite history
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate schema
        run: npx --yes -p ajv-cli@5 -p ajv-formats@3 ajv validate --spec=draft2020 -c ajv-formats -s schema.json -d list.json
      - name: Verify every entry against its pinned source
        run: node scripts/validate.mjs
      - name: LIST.md is in sync
        run: |
          node scripts/build-list.mjs
          git diff --exit-code LIST.md
